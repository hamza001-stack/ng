# Netlify build settings (these override the Netlify UI).
# Leave "Publish directory" EMPTY in the Netlify UI - the Next.js runtime sets it automatically.
[build]
  # No database step during the build: it only generates the Prisma client and builds Next.js.
  command = "npx prisma generate && npx next build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify's secrets scanner fails the build when a public value (site URL, publishable
  # keys) shows up in the built files. Those values are meant to be public, so scanning is off.
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
