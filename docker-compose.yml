services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nevie
      POSTGRES_PASSWORD: nevie
      POSTGRES_DB: nevie
    ports:
      - '5433:5432'
    volumes:
      - nevie_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nevie -d nevie']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nevie_pg:
